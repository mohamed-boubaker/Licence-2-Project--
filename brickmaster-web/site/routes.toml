# Définition d'un tableau de routes au format TOML (https://toml.io/)
# - url : chemin dans l'URL
# - controleur : chemin vers le fichier du controleur
# - template : chemin vers le fichier de template

[[routes]]
url = ""
controleur = "controleurs/accueil.py"
template = "accueil.html"

[[routes]]
url = "afficher"
controleur = "controleurs/afficher.py"
template = "afficher.html"

[[routes]]
url = "historique"
controleur = "controleurs/historique.py"
template = "historique.html"

[[routes]]
url = "ajouter"
controleur = "controleurs/ajouter.py"
template = "ajouter.html"

[[routes]]
url = "tab"
controleur = "controleurs/tab.py"
template = "tab.html"

[[routes]]
url = "choix"
controleur = "controleurs/choix.py"
template = "choix.html"